[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "penguin-mlp"
version = "1.0.0"
description = "Classificador acadêmico de espécies de pinguins utilizando CNN (ResNet18) como extrator e MLP treinada em PyTorch."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Patrick", email = "student@unicentro.br" }
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pillow>=9.0.0",
    "numpy>=1.22.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.5.0",
    "pandas>=1.5.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "imagehash>=4.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
