# Configuração centralizada para o projeto de classificação de pinguins (CNN ResNet18 + MLP)

seed: 42

dataset:
  root: "data/raw"
  split_dir: "data/splits"
  to_predict_dir: "data/to_predict"
  external_test_dir: "data/external_test"
  train_ratio: 0.70
  validation_ratio: 0.15
  test_ratio: 0.15
  class_names:
    - "Adelie"
    - "Chinstrap"
    - "Gentoo"
  image_size: 224
  # Preservação de proporção com preenchimento (letterbox) para não cortar o pinguim
  preserve_aspect_ratio: true

cnn:
  architecture: "resnet18"
  pretrained: true
  freeze: true
  feature_dim: 512

mlp:
  input_dim: 512
  hidden_dims:
    - 128
    - 64
  num_classes: 3
  dropout:
    - 0.30
    - 0.20

training:
  batch_size: 32
  epochs: 40
  learning_rate: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 6
  scheduler: "reduce_on_plateau"
  scheduler_factor: 0.5
  scheduler_patience: 3
  min_lr: 0.00001
  device: "auto"

inference:
  confidence_threshold: 0.60
  device: "auto"

artifacts:
  checkpoint_dir: "artifacts/checkpoints"
  metrics_dir: "artifacts/metrics"
  best_checkpoint_path: "artifacts/checkpoints/best_model.pt"
